appId: com.agenticsmith.app
---
# A cold API 34 emulator can show a launcher ANR over the healthy app, and a relaunch
# after clearState can take Maestro about half a minute to bring the app back.
- extendedWaitUntil:
    visible: "Sign up for Agentic Smith|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Agentic Smith"
    timeout: 30000
- tapOn: "Sign in"
- runFlow: server.yaml
- tapOn: "Email"
- inputText: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${AGENTIC_SMITH_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
