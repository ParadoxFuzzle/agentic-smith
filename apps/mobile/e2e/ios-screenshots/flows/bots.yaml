appId: com.agenticsmith.app
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- openLink: "agentic-smith:///bot-profile?botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "agentic-smith:///bot-model?botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "agentic-smith:///peer-chat?botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${AGENTIC_SMITH_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
- openLink: "agentic-smith:///routine?botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}&botName=Researcher"
- extendedWaitUntil:
    visible: "Add schedule"
    timeout: 15000
- tapOn: "Add schedule"
- extendedWaitUntil:
    visible: ".*How often.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-new-routine
