appId: com.agenticsmith.app
name: Models
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- openLink: "agentic-smith:///models"
- extendedWaitUntil:
    visible: ".*Claude Fable 5.1.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-models
- tapOn: ".*Claude Fable 5.1.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-model-picker
- openLink: "agentic-smith:///models"
- extendedWaitUntil:
    visible: "Add provider"
    timeout: 15000
- tapOn: "Add provider"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-add-provider
- tapOn: ".*OpenRouter.*"
- extendedWaitUntil:
    visible: "API key"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-model-connection
