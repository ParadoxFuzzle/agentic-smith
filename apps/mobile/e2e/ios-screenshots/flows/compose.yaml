appId: com.agenticsmith.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- openLink: "agentic-smith:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "agentic-smith:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-new-group-name
- openLink: "agentic-smith:///"
