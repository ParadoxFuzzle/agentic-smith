appId: com.agenticsmith.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
- tapOn: "Activity"
- extendedWaitUntil:
    visible: ".*Recent.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-activity
- tapOn: "Activity"
- openLink: "agentic-smith:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-artifacts
