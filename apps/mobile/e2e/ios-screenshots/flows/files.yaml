appId: com.agenticsmith.app
name: Files
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- openLink: "agentic-smith:///artifact?artifactId=${AGENTIC_SMITH_SCREENSHOT_ARTIFACT_ID}"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-text
- openLink: "agentic-smith:///artifact?artifactId=${AGENTIC_SMITH_SCREENSHOT_MARKDOWN_ID}"
- extendedWaitUntil:
    visible: ".*Collect customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-markdown
- openLink: "agentic-smith:///artifact?artifactId=${AGENTIC_SMITH_SCREENSHOT_PDF_ID}"
- extendedWaitUntil:
    visible: ".*launch-brief.pdf.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-pdf
- openLink: "agentic-smith:///artifact?artifactId=${AGENTIC_SMITH_SCREENSHOT_ARCHIVE_ID}"
- extendedWaitUntil:
    visible: ".*No preview.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-no-preview
- openLink: "agentic-smith:///image?artifactId=${AGENTIC_SMITH_SCREENSHOT_IMAGE_ID}&name=launch-chart.png&mimeType=image%2Fpng&botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*launch-chart.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-image
- openLink: "agentic-smith:///artifact?artifactId=${AGENTIC_SMITH_SCREENSHOT_VIDEO_ID}"
- extendedWaitUntil:
    visible: ".*launch-demo.mp4.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-video
