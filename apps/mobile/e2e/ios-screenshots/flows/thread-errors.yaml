appId: com.agenticsmith.app
name: Thread error recovery
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AGENTIC_SMITH_ACTIVE_EMAIL: ${AGENTIC_SMITH_SCREENSHOT_EMAIL}
- openLink: "agentic-smith:///thread?botId=${AGENTIC_SMITH_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*weekly limit.*"
    timeout: 20000
- assertVisible: "Add model"
- assertNotVisible: "Change model"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-limit-banner
- tapOn: "Details"
- extendedWaitUntil:
    visible: ".*reply stopped at its key's weekly limit.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-limit-details
